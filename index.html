<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>B1/B2 Vocabulary Splitter, Cleaner, Merger & Validator (Zero Data Loss)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 1200px; margin: 0 auto; }
        h2 { color: #38bdf8; margin-top: 0; text-align: center; }
        textarea { width: 100%; height: 220px; background: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; line-height: 1.4; resize: vertical; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button.secondary { background: #475569; }
        button.secondary:hover { background: #334155; }
        button.green { background: #059669; }
        button.green:hover { background: #047857; }
        button.purple { background: #7c3aed; }
        button.purple:hover { background: #6d28d9; }
        button.orange { background: #ea580c; }
        button.orange:hover { background: #c2410c; }
        button.red { background: #dc2626; }
        button.red:hover { background: #b91c1c; }
        .box { background: #1e293b; padding: 18px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        
        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 850px) { .split-grid { grid-template-columns: 1fr; } }

        .stats-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .stat-badge { background: #334155; padding: 6px 12px; border-radius: 8px; font-size: 12px; color: #e2e8f0; border: 1px solid #475569; cursor: pointer; }
        .stat-badge:hover { background: #0284c7; color: #fff; }
        .stat-badge b { color: #38bdf8; }
        .alert-box { background: #166534; border: 1px solid #22c55e; color: #dcfce7; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .alert-box.danger { background: #7f1d1d; border-color: #ef4444; color: #fecaca; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #1e293b; margin: 5% auto; padding: 20px; border: 1px solid #38bdf8; border-radius: 12px; width: 85%; max-width: 900px; max-height: 85vh; overflow-y: auto; color: #fff; }
        .close-btn { color: #94a3b8; float: right; font-size: 24px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        ul { margin-top: 5px; padding-left: 20px; }
        li { margin-bottom: 6px; font-size: 13px; line-height: 1.5; }
        .hl-char { background: #ef4444; color: white; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        
        .dup-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .option-box { background: #1e293b; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; margin-top: 6px; font-size: 12px; cursor: pointer; }
        .option-box:hover { border-color: #38bdf8; }
        .option-box input { margin-right: 8px; }
        pre.json-preview { background: #090d16; padding: 8px; border-radius: 6px; color: #38bdf8; font-size: 11px; max-height: 150px; overflow: auto; margin-top: 5px; }
        
        .mode-select { background: #0f172a; border: 1px solid #38bdf8; color: #38bdf8; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <h2>🧹 Công cụ Tách, Lọc Trùng, Kiểm Lỗi & Hợp Nhất JSON (Bảo Vệ Dữ Liệu 100%)</h2>

    <!-- Ô NHẬP LIỆU BAN ĐẦU -->
    <div class="box">
        <label style="font-weight: bold; color: #94a3b8; display: block; margin-bottom: 8px;">1. Dán văn bản hỗn hợp (Chat AI, Code HTML, JSON...) vào đây để phân tách:</label>
        <textarea id="raw-input" placeholder="Dán đoạn chat hoặc file chứa hỗn hợp lời thoại, mã code và JSON vào đây..."></textarea>
        <div class="btn-group">
            <button onclick="splitContent()">⚡ 1. Tách Tự Động Vào 2 Khung</button>
            <button class="secondary" onclick="clearAll()">🗑️ Xóa Hết Ô Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN 2 KHUNG TÁCH BIỆT -->
    <div class="split-grid">
        <!-- KHUNG 1: JSON -->
        <div class="box" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
                <label style="font-weight: bold; color: #38bdf8;">📦 Khung 1: Dữ Liệu JSON Từ Vựng</label>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button class="green" onclick="cleanAndSortJSON(false)" style="padding: 6px 10px; font-size: 12px;">🧹 Lọc Trùng & Sắp Xếp</button>
                    <button class="purple" onclick="validateDataset()" style="padding: 6px 10px; font-size: 12px;">🔍 Kiểm Tra Toàn Bộ Lỗi</button>
                </div>
            </div>

            <div class="mode-select">
                <input type="checkbox" id="strict-mode-check" checked style="cursor: pointer;">
                <label for="strict-mode-check" style="cursor: pointer;">
                    <b>Chế độ An Toàn Cao:</b> Phân biệt từ trùng theo cả <code>word + ans + level + lek</code> (Tránh xóa nhầm từ ở bài học khác).
                </label>
            </div>

            <textarea id="json-box" style="height: 300px;" placeholder="Chứa mảng JSON từ vựng..."></textarea>
            <div class="btn-group" style="margin-bottom: 0;">
                <button class="secondary" onclick="copyText('json-box')">📋 Copy JSON</button>
            </div>
        </div>

        <!-- KHUNG 2: CODE / LỜI THOẠI -->
        <div class="box" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label style="font-weight: bold; color: #facc15;">📝 Khung 2: Văn Bản / Mã Code Lời Thoại</label>
                <span style="font-size: 11px; color: #94a3b8;">Vị trí JSON sẽ ghi: [[JSON_DATA]]</span>
            </div>
            <textarea id="text-box" style="height: 350px;" placeholder="Chứa mã code HTML/JS hoặc lời thoại không phải JSON..."></textarea>
            <div class="btn-group" style="margin-bottom: 0;">
                <button class="secondary" onclick="copyText('text-box')">📋 Copy Mã Code/Văn Bản</button>
            </div>
        </div>
    </div>

    <!-- KHU VỰC NÚT BẤM BÁO CÁO & PHÂN LOẠI -->
    <div id="stats-section" class="box" style="display: none; background: #0f172a;">
        <div id="dedup-alert" class="alert-box"></div>
        <div id="parse-error-alert" class="alert-box danger" style="display: none;"></div>
        
        <h3 style="margin-top:0; color:#38bdf8; font-size: 15px;">🔍 Nút bấm kiểm tra nhanh theo loại lỗi:</h3>
        <div class="btn-group" style="margin-bottom: 15px;">
            <button id="btn-parse-err" class="red" onclick="showParseErrorsList()" style="display:none;">❌ 0 Đoạn JSON Lỗi Cú Pháp</button>
            <button id="btn-dup" class="orange" onclick="cleanAndSortJSON(false)" style="display:none;">📋 0 Từ Trùng</button>
            <button id="btn-vn" class="red" onclick="showVnErrorsList()" style="display:none;">⚠️ 0 Lỗi Tiếng Việt</button>
            <button id="btn-missing" class="purple" onclick="showMissingFieldsList()" style="display:none;">⚠️ 0 Từ Thiếu Trường</button>
        </div>

        <h3 style="margin:0; color:#4ade80; font-size: 15px;">📊 Thống kê danh sách theo Trình độ & Lek:</h3>
        <div id="stats-container" class="stats-grid"></div>
    </div>

    <!-- KHU VỰC HỢP NHẤT -->
    <div class="box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="font-weight: bold; color: #4ade80;">🔄 3. Kết Quả Hợp Nhất Hoàn Chỉnh (Khung 1 + Khung 2):</label>
            <div class="btn-group" style="margin: 0;">
                <button class="purple" onclick="mergeContent()">⚡ Hợp Nhất Ngay</button>
                <button class="green" onclick="copyText('merged-box')">📋 Copy Kết Quả Hoàn Chỉnh</button>
            </div>
        </div>
        <textarea id="merged-box" style="height: 250px;" readonly placeholder="Sau khi bấm 'Hợp Nhất Ngay', đoạn văn bản/code hoàn chỉnh sẽ xuất hiện ở đây..."></textarea>
    </div>

    <!-- MODAL HIỂN THỊ CHI TIẾT -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="color: #38bdf8; margin-top: 0;"></h3>
            <div id="modal-body"></div>
        </div>
    </div>

<script>
    window.duplicateLog = [];
    window.vnErrorsLog = [];
    window.missingFieldsLog = [];
    window.parseErrorsLog = [];
    window.duplicateGroupsData = {};
    window.nonDuplicateItems = [];
    window.totalOriginalCount = 0;

    // --- 1. TÁCH DỮ LIỆU TỰ ĐỘNG LỌC CSS/JS ---
    function splitContent() {
        const raw = document.getElementById('raw-input').value.trim();
        if (!raw) return alert("Vui lòng dán văn bản vào ô số 1!");

        window.parseErrorsLog = [];
        let extractedObjects = [];

        // ƯU TIÊN 1: Tìm mảng data = [...] trong mã JS/HTML
        let dataArrayRegex = /(?:const|let|var)\s+data\s*=\s*(\[\s*\{[\s\S]*?\}\s*\])\s*;/i;
        let dataMatch = raw.match(dataArrayRegex);

        if (dataMatch) {
            let jsonString = dataMatch[1];
            
            let fixedJsonString = jsonString
                .replace(/\}\s*\{/g, '},\n{')
                .replace(/,\s*\]/g, ']');

            try {
                let parsed = JSON.parse(fixedJsonString);
                if (Array.isArray(parsed)) {
                    extractedObjects = parsed;
                    let textContent = raw.replace(dataArrayRegex, 'const data = [[JSON_DATA]];');
                    document.getElementById('json-box').value = JSON.stringify(extractedObjects, null, 2);
                    document.getElementById('text-box').value = textContent.trim();
                    showExtractionSummary(extractedObjects.length);
                    return;
                }
            } catch(e) {
                window.parseErrorsLog.push({ snippet: jsonString.substring(0, 300) + '...', error: "Lỗi mảng tổng: " + e.message });
            }
        }

        // ƯU TIÊN 2: Tìm khối ```json ... ``` trong đoạn chat Markdown
        let jsonBlockRegex = /```json\s*([\s\S]*?)\s*```/gi;
        let match;
        let hasMarkdown = false;

        while ((match = jsonBlockRegex.exec(raw)) !== null) {
            hasMarkdown = true;
            let blockStr = match[1].replace(/\}\s*\{/g, '},\n{').replace(/,\s*\]/g, ']');
            try {
                let parsed = JSON.parse(blockStr);
                if (Array.isArray(parsed)) {
                    extractedObjects.push(...parsed);
                } else if (parsed && typeof parsed === 'object') {
                    extractedObjects.push(parsed);
                }
            } catch(e) {
                window.parseErrorsLog.push({ snippet: match[1], error: "Lỗi khối ```json: " + e.message });
            }
        }

        if (hasMarkdown && extractedObjects.length > 0) {
            let textContent = raw.replace(/```json\s*([\s\S]*?)\s*```/gi, '\n```json\n[[JSON_DATA]]\n```\n');
            document.getElementById('json-box').value = JSON.stringify(extractedObjects, null, 2);
            document.getElementById('text-box').value = textContent.trim();
            showExtractionSummary(extractedObjects.length);
            return;
        }

        // ƯU TIÊN 3: Quét từng đối tượng { ... } từ vựng độc lập
        let depth = 0;
        let startIdx = -1;
        let inString = false;
        let escaped = false;
        let jsonRanges = [];

        for (let i = 0; i < raw.length; i++) {
            let char = raw[i];
            if (inString) {
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === '"') inString = false;
            } else {
                if (char === '"') inString = true;
                else if (char === '{') {
                    if (depth === 0) startIdx = i;
                    depth++;
                } else if (char === '}') {
                    depth--;
                    if (depth === 0 && startIdx !== -1) {
                        let objStr = raw.substring(startIdx, i + 1);

                        let isCSSorJS = /(--[\w-]+|font-family|display:|padding:|margin:|border:|background:|function|document\.|window\.|const |let |return )/i.test(objStr);
                        let isVocabCandidate = /("word"|"ans"|"vnword"|"b1_ex"|"vnans")/i.test(objStr);

                        if (!isCSSorJS && isVocabCandidate) {
                            try {
                                let obj = JSON.parse(objStr);
                                if (obj && typeof obj === 'object' && (obj.word || obj.ans || obj.vnword)) {
                                    extractedObjects.push(obj);
                                    jsonRanges.push([startIdx, i + 1]);
                                }
                            } catch (err) {
                                window.parseErrorsLog.push({ snippet: objStr, error: err.message });
                            }
                        }
                        startIdx = -1;
                    }
                }
            }
        }

        if (extractedObjects.length > 0) {
            let firstStart = jsonRanges[0][0];
            let lastEndIdx = jsonRanges[jsonRanges.length - 1][1];
            
            let prefix = raw.substring(0, firstStart);
            let suffix = raw.substring(lastEndIdx);

            let openBracketPos = prefix.lastIndexOf('[');
            let closeBracketPos = suffix.indexOf(']');

            let finalText = "";
            if (openBracketPos !== -1 && closeBracketPos !== -1 && openBracketPos > prefix.lastIndexOf('}')) {
                finalText = prefix.substring(0, openBracketPos) + '[[JSON_DATA]]' + suffix.substring(closeBracketPos + 1);
            } else {
                finalText = prefix + '[[JSON_DATA]]' + suffix;
            }

            document.getElementById('json-box').value = JSON.stringify(extractedObjects, null, 2);
            document.getElementById('text-box').value = finalText.trim();
            showExtractionSummary(extractedObjects.length);
        } else {
            document.getElementById('json-box').value = "[]";
            document.getElementById('text-box').value = raw;
            if (window.parseErrorsLog.length > 0) {
                alert(`❌ Phát hiện ${window.parseErrorsLog.length} đối tượng từ vựng bị lỗi cú pháp. Vui lòng kiểm tra báo cáo lỗi!`);
                updateParseErrorAlert();
            } else {
                alert("⚠️ Không tìm thấy đối tượng JSON từ vựng nào hợp lệ.");
            }
        }
    }

    function showExtractionSummary(successCount) {
        let msg = `✨ Đã bóc tách thành công ${successCount} từ vựng vào Khung 1!`;
        if (window.parseErrorsLog.length > 0) {
            msg += `\n⚠️ Có ${window.parseErrorsLog.length} từ vựng bị lỗi cú pháp JSON. Bấm nút đỏ bên dưới để xem chi tiết.`;
        }
        alert(msg);
        updateParseErrorAlert();
    }

    function updateParseErrorAlert() {
        const btnParseErr = document.getElementById('btn-parse-err');
        const alertBox = document.getElementById('parse-error-alert');
        
        if (window.parseErrorsLog.length > 0) {
            btnParseErr.innerText = `❌ ${window.parseErrorsLog.length} Từ Vựng Bị Lỗi Cú Pháp`;
            btnParseErr.style.display = 'inline-block';
            alertBox.style.display = 'block';
            alertBox.innerHTML = `⚠️ Phát hiện <b>${window.parseErrorsLog.length}</b> từ vựng bị lỗi cú pháp JSON (do sai dấu ngoặc, thiếu phẩy...). Những từ này đang nằm trong danh sách lỗi để sửa.`;
            document.getElementById('stats-section').style.display = 'block';
        } else {
            btnParseErr.style.display = 'none';
            alertBox.style.display = 'none';
        }
    }

    function showParseErrorsList() {
        if (window.parseErrorsLog.length === 0) return alert("Không có đoạn JSON nào bị lỗi cú pháp!");
        let html = `<p style="color:#f87171;">Dưới đây là <b>${window.parseErrorsLog.length}</b> từ vựng không thể đọc được do lỗi cú pháp:</p>`;
        
        window.parseErrorsLog.forEach((err, idx) => {
            html += `<div class="dup-card">`;
            html += `<h4 style="margin:0 0 6px 0; color:#f87171;">#${idx+1}. Lỗi: ${err.error}</h4>`;
            html += `<pre class="json-preview" style="color:#fca5a5;">${err.snippet}</pre>`;
            html += `</div>`;
        });

        document.getElementById('modal-title').innerText = `❌ Danh Sách Từ Vựng Lỗi Cú Pháp`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('detail-modal').style.display = 'block';
    }

    // --- 2. HỢP NHẤT DỮ LIỆU ---
    function mergeContent() {
        const jsonText = document.getElementById('json-box').value.trim();
        const codeText = document.getElementById('text-box').value.trim();

        if (!jsonText && !codeText) return alert("Cả 2 khung đều đang trống!");

        let formattedJSON = jsonText;
        try {
            const parsed = JSON.parse(jsonText);
            formattedJSON = JSON.stringify(parsed, null, 2);
        } catch(e) {}

        let result = "";
        if (codeText.includes("[[JSON_DATA]]")) {
            result = codeText.replace("[[JSON_DATA]]", formattedJSON);
        } else if (codeText) {
            result = codeText + "\n\n```json\n" + formattedJSON + "\n```";
        } else {
            result = formattedJSON;
        }

        document.getElementById('merged-box').value = result;
        alert("🎉 Đã hợp nhất Khung 1 và Khung 2 thành công!");
    }

    // --- 3. SẮP XẾP & LỌC TRÙNG BẢO VỆ CẤP ĐỘ ---
    function getLevelRank(item) {
        const lvl = String(item.level || '').trim();
        if (lvl === "A1") return 10;
        if (lvl === "A2") return 20;
        if (lvl.includes("Goethe") || lvl === "B1 Goethe" || lvl === "B1") return 100;
        if (lvl === "B1+") return 200;
        if (lvl === "B2.1") return 300;
        if (lvl === "B2.2" || lvl === "B2") return 400;
        if (lvl.toLowerCase().includes("präposition") || lvl === "Mit Präposition") return 500;
        return 900;
    }

    function getSubRank(item, mainLevelRank) {
        const lek = String(item.lek !== undefined && item.lek !== null ? item.lek : '').trim().toLowerCase();
        const type = String(item.type || '').trim().toLowerCase();

        if (lek === 'redemittel' || type.includes('redemittel')) return 990;
        if (lek === 'morong' || lek === 'advanced' || lek === '0') return 900;

        if (lek === 'a1') return 10;
        if (lek === 'a2') return 20;
        if (lek === 'b1') return 30;
        if (lek === 'b2') return 40;
        if (lek === 'c1') return 50;

        const numLek = parseInt(lek);
        if (!isNaN(numLek) && numLek > 0) return numLek;

        return 500;
    }

    function cleanString(str) {
        if (typeof str !== 'string') return str;
        return str.trim().replace(/\s+/g, ' ').replace(/\s*,\s*/g, ', ').replace(/\s*\/\s*/g, ' / ');
    }

    function createSmartMergedObject(items) {
        let merged = {};
        items.forEach(item => {
            for (let k in item) {
                let val = item[k];
                if (!merged[k] || merged[k] === 0 || merged[k] === "0" || merged[k] === "-" || merged[k] === "") {
                    if (val !== undefined && val !== null && val !== "") {
                        merged[k] = val;
                    }
                }
            }
        });
        return merged;
    }

    function cleanAndSortJSON(autoApply = false) {
        const jsonStr = document.getElementById('json-box').value.trim();
        if (!jsonStr) return alert("Ô JSON đang trống!");

        let data = [];
        try {
            data = JSON.parse(jsonStr);
            if (!Array.isArray(data)) throw new Error();
        } catch(e) {
            return alert("❌ Dữ liệu ở Khung 1 không phải là mảng JSON hợp lệ!");
        }

        const isStrictMode = document.getElementById('strict-mode-check').checked;

        window.totalOriginalCount = data.length;
        const dupGroups = {};
        window.nonDuplicateItems = [];

        data.forEach(item => {
            let newItem = {};
            for (let key in item) {
                newItem[key] = (typeof item[key] === 'string') ? cleanString(item[key]) : item[key];
            }

            const wordVal = (newItem.word || '').toLowerCase().trim();
            const ansVal = (newItem.ans || '').toLowerCase().trim();
            const levelVal = (newItem.level || '').toLowerCase().trim();
            const lekVal = String(newItem.lek !== undefined ? newItem.lek : '').toLowerCase().trim();

            if (!wordVal) {
                window.nonDuplicateItems.push(newItem);
                return;
            }

            const uniqueKey = isStrictMode 
                ? `${wordVal}___${ansVal}___${levelVal}___${lekVal}`
                : `${wordVal}___${ansVal}`;

            if (!dupGroups[uniqueKey]) {
                dupGroups[uniqueKey] = [];
            }
            dupGroups[uniqueKey].push(newItem);
        });

        window.duplicateGroupsData = {};
        let duplicateKeys = [];

        for (let uKey in dupGroups) {
            if (dupGroups[uKey].length > 1) {
                duplicateKeys.push(uKey);
                window.duplicateGroupsData[uKey] = {
                    word: dupGroups[uKey][0].word,
                    ans: dupGroups[uKey][0].ans,
                    items: dupGroups[uKey],
                    smartMerged: createSmartMergedObject(dupGroups[uKey])
                };
            } else {
                window.nonDuplicateItems.push(dupGroups[uKey][0]);
            }
        }

        window.duplicateLog = duplicateKeys.map(k => ({
            word: window.duplicateGroupsData[k].word,
            ans: window.duplicateGroupsData[k].ans,
            count: window.duplicateGroupsData[k].items.length
        }));

        if (duplicateKeys.length > 0 && !autoApply) {
            showDuplicateChoiceModal();
        } else {
            let defaultCleaned = [...window.nonDuplicateItems];
            duplicateKeys.forEach(k => {
                defaultCleaned.push(window.duplicateGroupsData[k].smartMerged);
            });
            applyFinalCleanedData(defaultCleaned);
        }
    }

    function showDuplicateChoiceModal() {
        let keys = Object.keys(window.duplicateGroupsData);
        let html = `<p style="color:#facc15;">⚠️ Phát hiện <b>${keys.length}</b> nhóm từ trùng lặp cấu trúc.</p>`;
        
        html += `<button class="green" style="margin-bottom:15px; width:100%; padding:10px; font-size:14px;" onclick="confirmSelectedMergeOptions()">✅ Xác Nhận Gộp Tất Cả Theo Tùy Chọn Đã Chọn</button>`;

        keys.forEach((uKey, idx) => {
            let group = window.duplicateGroupsData[uKey];
            html += `<div class="dup-card">`;
            html += `<h4 style="margin:0 0 6px 0; color:#38bdf8;">#${idx+1}. Từ: "${group.word}" - <i>ans: ${group.ans}</i> <span style="color:#f87171; font-weight:normal; font-size:12px;">(Trùng ${group.items.length} bản)</span></h4>`;
            
            html += `<label class="option-box" style="display:block;">`;
            html += `<input type="radio" name="opt_group_${idx}" value="smart" checked> <b>[MẶC ĐỊNH] Gộp thông minh (Giữ lại tất cả trường dữ liệu)</b>`;
            html += `<pre class="json-preview">${JSON.stringify(group.smartMerged, null, 2)}</pre>`;
            html += `</label>`;

            group.items.forEach((item, itemIdx) => {
                html += `<label class="option-box" style="display:block;">`;
                html += `<input type="radio" name="opt_group_${idx}" value="${itemIdx}"> <b>Giữ riêng Bản #${itemIdx + 1}</b> (level: "${item.level || ''}", lek: "${item.lek !== undefined ? item.lek : ''}")`;
                html += `<pre class="json-preview">${JSON.stringify(item, null, 2)}</pre>`;
                html += `</label>`;
            });

            html += `</div>`;
        });

        document.getElementById('modal-title').innerText = `🔍 Xem Trước & Lựa Chọn Phương Thức Gộp Từ Trùng`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('detail-modal').style.display = 'block';
    }

    function confirmSelectedMergeOptions() {
        let finalCleaned = [...window.nonDuplicateItems];
        let keys = Object.keys(window.duplicateGroupsData);

        keys.forEach((uKey, idx) => {
            let selectedElem = document.querySelector(`input[name="opt_group_${idx}"]:checked`);
            let selectedOpt = selectedElem ? selectedElem.value : "smart";
            let group = window.duplicateGroupsData[uKey];

            if (selectedOpt === "smart") {
                finalCleaned.push(group.smartMerged);
            } else {
                let chosenIndex = parseInt(selectedOpt);
                finalCleaned.push(group.items[chosenIndex]);
            }
        });

        applyFinalCleanedData(finalCleaned);
        closeModal();
        alert("✨ Đã áp dụng gộp thành công!");
    }

    function applyFinalCleanedData(uniqueData) {
        uniqueData.sort((a, b) => {
            const mainRankA = getLevelRank(a), mainRankB = getLevelRank(b);
            if (mainRankA !== mainRankB) return mainRankA - mainRankB;

            const subRankA = getSubRank(a, mainRankA), subRankB = getSubRank(b, mainRankB);
            if (subRankA !== subRankB) return subRankA - subRankB;

            return (a.word || '').localeCompare((b.word || ''), 'de');
        });

        document.getElementById('json-box').value = JSON.stringify(uniqueData, null, 2);
        window.cleanedData = uniqueData;

        const numDupes = window.totalOriginalCount - uniqueData.length;
        document.getElementById('dedup-alert').innerHTML = 
            `🎉 Đã xử lý thành công! Tổng ban đầu: <b>${window.totalOriginalCount}</b> từ ➔ Còn <b>${uniqueData.length}</b> từ duy nhất (Lọc bỏ ${numDupes} bản trùng).`;

        const btnDup = document.getElementById('btn-dup');
        if (window.duplicateLog.length > 0) {
            btnDup.innerText = `📋 ${window.duplicateLog.length} Nhóm Trùng Cấu Trúc`;
            btnDup.style.display = 'inline-block';
        } else {
            btnDup.style.display = 'none';
        }

        const stats = {};
        uniqueData.forEach(item => {
            const groupKey = `${item.level || 'Khác'} (Lek: ${item.lek !== undefined ? item.lek : ''})`;
            stats[groupKey] = (stats[groupKey] || 0) + 1;
        });

        document.getElementById('stats-container').innerHTML = Object.keys(stats).map(key => 
            `<div class="stat-badge" onclick="showCategoryDetails('${key}')">
                <b>${key}</b>: ${stats[key]} từ 🔍
            </div>`
        ).join('');

        document.getElementById('stats-section').style.display = 'block';
        validateDataset(true);
    }

    // --- 4. BỘ KIỂM TRA LỖI KÝ TỰ TIẾNG VIỆT ---
    function sanitizeGermanText(text) {
        if (!text) return '';
        return text.replace(/\b(Café|Cafés|Exposé|Exposés|Résumé|Résumés|Varieté|Varietés|Cliché|Clichés|Touché|Fiancée|Séparée|Kommuniqué|Renommee)\b/gi, 'Cafe')
                   .replace(/é/g, 'e')
                   .replace(/É/g, 'E');
    }

    function validateDataset(silent = false) {
        const jsonStr = document.getElementById('json-box').value.trim();
        if (!jsonStr) {
            if (!silent) alert("Ô JSON đang trống!");
            return;
        }

        let data = [];
        try {
            data = JSON.parse(jsonStr);
            if (!Array.isArray(data)) throw new Error();
        } catch(e) {
            if (!silent) alert("❌ Dữ liệu ở Khung 1 không phải là mảng JSON hợp lệ!");
            return;
        }

        const vnCharRegex = /[àáảãạâầấẩẫậăằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđÀÁẢÃẠÂẦẤẨẪẬĂẰẮẲẴẶÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴĐ]/;

        window.vnErrorsLog = [];
        window.missingFieldsLog = [];

        data.forEach((item, index) => {
            const word = item.word || `Mục index #${index}`;

            if (item.b1_ex) {
                const cleanText1 = sanitizeGermanText(item.b1_ex);
                const match1 = cleanText1.match(vnCharRegex);
                if (match1) {
                    window.vnErrorsLog.push({ word, field: 'b1_ex', text: item.b1_ex, char: match1[0] });
                }
            }

            if (item.b2_ex) {
                const cleanText2 = sanitizeGermanText(item.b2_ex);
                const match2 = cleanText2.match(vnCharRegex);
                if (match2) {
                    window.vnErrorsLog.push({ word, field: 'b2_ex', text: item.b2_ex, char: match2[0] });
                }
            }

            let missing = [];
            if (!item.word) missing.push('word');
            if (!item.ans) missing.push('ans');
            if (!item.b1_ex) missing.push('b1_ex');
            if (!item.vn_b1) missing.push('vn_b1');
            if (!item.b2_ex) missing.push('b2_ex');
            if (!item.vn_b2) missing.push('vn_b2');

            if (missing.length > 0) {
                window.missingFieldsLog.push({ word, missing });
            }
        });

        const btnVn = document.getElementById('btn-vn');
        const btnMissing = document.getElementById('btn-missing');

        if (window.vnErrorsLog.length > 0) {
            btnVn.innerText = `⚠️ ${window.vnErrorsLog.length} Lỗi Tiếng Việt`;
            btnVn.style.display = 'inline-block';
        } else {
            btnVn.style.display = 'none';
        }

        if (window.missingFieldsLog.length > 0) {
            btnMissing.innerText = `⚠️ ${window.missingFieldsLog.length} Từ Thiếu Trường`;
            btnMissing.style.display = 'inline-block';
        } else {
            btnMissing.style.display = 'none';
        }

        document.getElementById('stats-section').style.display = 'block';

        if (!silent) {
            if (window.vnErrorsLog.length === 0 && window.missingFieldsLog.length === 0) {
                alert("🎉 Tuyệt vời! Không phát hiện lỗi tiếng Việt trong câu Đức hoặc thiếu trường dữ liệu nào.");
            } else {
                alert(`⚠️ Kiểm tra hoàn tất:\n- Lỗi Tiếng Việt trong câu Đức: ${window.vnErrorsLog.length}\n- Từ thiếu trường dữ liệu: ${window.missingFieldsLog.length}`);
            }
        }
    }

    // --- 5. HÀM HIỂN THỊ CÁC MODAL ---
    function showVnErrorsList() {
        if (!window.vnErrorsLog || window.vnErrorsLog.length === 0) return alert("Không có câu Đức nào dính Tiếng Việt!");
        let html = `<p>Phát hiện <b>${window.vnErrorsLog.length}</b> câu Tiếng Đức dính ký tự Tiếng Việt:</p><ul>`;
        window.vnErrorsLog.forEach(e => {
            html += `<li><b>${e.word}</b> [<i>${e.field}</i>]: "${e.text}" <br><small style="color:#f87171;">➔ Ký tự Tiếng Việt phát hiện: <span class="hl-char">'${e.char}'</span></small></li>`;
        });
        html += `</ul>`;

        document.getElementById('modal-title').innerText = `⚠️ Danh Sách Lỗi Tiếng Việt Trong Câu Tiếng Đức`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('detail-modal').style.display = 'block';
    }

    function showMissingFieldsList() {
        if (!window.missingFieldsLog || window.missingFieldsLog.length === 0) return alert("Không có từ nào bị thiếu trường!");
        let html = `<p>Danh sách <b>${window.missingFieldsLog.length}</b> từ bị thiếu thông tin bắt buộc:</p><ul>`;
        window.missingFieldsLog.forEach(e => {
            html += `<li><b>${e.word}</b>: Thiếu các trường <i>[${e.missing.join(', ')}]</i></li>`;
        });
        html += `</ul>`;

        document.getElementById('modal-title').innerText = `⚠️ Danh Sách Từ Thiếu Trường Dữ Liệu`;
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('detail-modal').style.display = 'block';
    }

    function showCategoryDetails(groupKey) {
        const items = (window.cleanedData || []).filter(v => `${v.level || 'Khác'} (Lek: ${v.lek !== undefined ? v.lek : ''})` === groupKey);
        document.getElementById('modal-title').innerText = `📌 Nhóm: "${groupKey}" (${items.length} từ)`;
        document.getElementById('modal-body').innerHTML = `<pre style="background:#0f172a; padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; color:#38bdf8;">${JSON.stringify(items, null, 2)}</pre>`;
        document.getElementById('detail-modal').style.display = 'block';
    }

    function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }

    function copyText(id) {
        const el = document.getElementById(id);
        if (!el.value.trim()) return alert("Không có nội dung để copy!");
        el.select();
        navigator.clipboard.writeText(el.value);
        alert("📋 Đã copy nội dung vào khay nhớ tạm!");
    }

    function clearAll() {
        if (confirm("Xóa toàn bộ nội dung ở các ô?")) {
            document.getElementById('raw-input').value = "";
            document.getElementById('json-box').value = "";
            document.getElementById('text-box').value = "";
            document.getElementById('merged-box').value = "";
            document.getElementById('stats-section').style.display = 'none';
        }
    }
</script>
</body>
</html>
